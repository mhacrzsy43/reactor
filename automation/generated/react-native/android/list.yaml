appId: com.reactor.bench.reactnative
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Username"
    commands:
      - tapOn: "Username"
      - inputText: "test"
      - tapOn: "Password"
      - inputText: "test"
      - hideKeyboard
      # Three "Sign in" candidates on auth screen (header / tab / submit).
      - tapOn:
          text: "Sign in"
          index: 2
- assertVisible: "Reactor ready"
- tapOn: "List scenario"
- assertVisible: "List ready"
- repeat:
    times: 8
    commands:
      - swipe:
          direction: UP
          duration: 800
- repeat:
    times: 2
    commands:
      - swipe:
          direction: DOWN
          duration: 800
